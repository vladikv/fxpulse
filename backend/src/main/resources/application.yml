server:
  port: ${PORT:8098}

spring:
  application:
    name: fxpulse
  datasource:
    # Values come from env vars; defaults match docker-compose.yml for local development.
    url: ${DB_URL:jdbc:postgresql://localhost:25432/fxpulse}
    username: ${DB_USERNAME:fxpulse}
    password: ${DB_PASSWORD:fxpulse}
    hikari:
      # Neon's free tier allows few connections and a 512 MB cloud instance doesn't need 10 (Render sets 5).
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only checks it matches the entities
    open-in-view: false
  flyway:
    enabled: true

app:
  nbp:
    base-url: https://api.nbp.pl/api
    # NBP documents a 93-day limit per range query (the server currently enforces 367); longer ranges are split.
    max-days-per-request: 93
    connect-timeout: 5s
    read-timeout: 20s
  ingestion:
    backfill-days: 365            # default for POST /api/admin/ingest
    scheduled-days: 7             # the daily job re-checks the last week (catches up after holidays/outages)
    cron: "0 30 12 * * MON-FRI"   # NBP publishes table A around 11:45-12:15 Warsaw time on business days
    scheduler-enabled: ${INGESTION_SCHEDULER_ENABLED:true}
  rates:
    max-range-days: 366           # longest from..to range per request (a full leap year)
    default-range-days: 30        # used when the client omits "from"
  ai:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.5-flash-lite  # stable Flash-Lite with a free tier
    api-key: ${GEMINI_API_KEY:}   # secret: only from the env var; empty = AI disabled (503)
    max-output-tokens: 1024       # a 3-4 sentence summary needs ~150; headroom so it is never cut off
    connect-timeout: 5s
    read-timeout: 30s             # LLM answers take seconds
    max-generations-per-day: 50   # global cap on fresh Gemini calls, so varying dates can't drain the quota
  admin:
    # Shared secret for /api/admin/** (header X-Admin-Token). Empty = admin API disabled (403).
    token: ${ADMIN_TOKEN:}
  cors:
    # Browser origins allowed to call /api/** (comma-separated in the env var). Default: Vite dev server.
    # An origin is scheme://host[:port] with no path and no trailing slash, or it never matches.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**         # document our API only, not actuator endpoints

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
