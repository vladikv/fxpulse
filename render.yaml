# Render Blueprint: the cloud setup as code. In the Render dashboard: New -> Blueprint -> this repo.
# Secrets are never written here: "sync: false" values are typed into the dashboard once, at creation.
# Docs: https://render.com/docs/blueprint-spec
services:
  # ---- Backend: Spring Boot, built from backend/Dockerfile ----
  - type: web
    name: fxpulse-api
    runtime: docker
    plan: free                      # 512 MB, sleeps after 15 min without traffic
    region: frankfurt               # close to the Neon database (AWS eu-central-1) and to NBP
    rootDir: backend                # only changes in backend/ trigger a new build
    # With rootDir set, Render resolves these two paths relative to rootDir (not the repo root).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass   # deploy a commit on main only after the CI checks are green
    envVars:
      # Neon connection (direct, not pooled): jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Exact origin of the static site below, e.g. https://fxpulse-web.onrender.com (no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Random 256-bit secret generated by Render; copy it into the GitHub secret ADMIN_TOKEN.
      - key: ADMIN_TOKEN
        generateValue: true
      # A sleeping instance can't run @Scheduled jobs; GitHub Actions (daily-ingest.yml) triggers ingestion.
      - key: INGESTION_SCHEDULER_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"

  # ---- Frontend: static files built by Vite, served from Render's CDN ----
  - type: web
    name: fxpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      # Read by Vite at build time, e.g. https://fxpulse-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: "24"
    # Single-page app: unknown paths get index.html (same as try_files in nginx.conf).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The same headers nginx.conf sends in Docker.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
