# Included in every location of nginx.conf. nginx only inherits add_header from the server level when a
# location defines none of its own, and ours set Cache-Control, so the headers are repeated per location.
add_header X-Content-Type-Options "nosniff" always;              # don't guess content types
add_header X-Frame-Options "DENY" always;                        # the app must not be embedded in frames
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
