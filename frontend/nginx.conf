# Serves the built single-page app. The API is a separate origin (CORS), so nginx only serves files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;   # don't advertise the nginx version

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Vite puts a content hash in every asset name (index-4DE4fvff.js): a changed file gets a new name,
    # so browsers may cache these forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must always be fresh, or a browser would keep loading the old asset names after a deploy.
    # Unknown paths also get index.html (standard single-page-app fallback).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
