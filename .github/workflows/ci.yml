# Builds and tests everything on every pull request and on every push to main.
# Three independent jobs run in parallel; the PR is green only when all three pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung run fails fast instead of using up to 6 hours
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # reuses ~/.m2 between runs, keyed on pom.xml
      # Unit, @WebMvcTest and Testcontainers tests. Docker is preinstalled on GitHub's Ubuntu runners,
      # so Testcontainers starts PostgreSQL there; WireMock stubs NBP and Gemini (no internet, no secrets).
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung run fails fast instead of using up to 6 hours
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc -b type-check + Vite production build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung run fails fast instead of using up to 6 hours
    steps:
      - uses: actions/checkout@v7
      # Catches a broken Dockerfile before it is deployed. Nothing is pushed anywhere.
      - run: docker compose build
