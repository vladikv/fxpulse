# Loads the newest NBP rates into the deployed app every business day.
# Why here and not with @Scheduled in the app: a free Render instance sleeps after 15 minutes without
# traffic, and a sleeping app runs no scheduled jobs. This request also wakes it up.
# Note: GitHub pauses scheduled workflows in a repository without activity for 60 days.
name: Daily NBP ingestion

on:
  schedule:
    # 11:30 UTC on Mon-Fri = 12:30 Warsaw in winter, 13:30 in summer (NBP publishes table A ~11:45-12:15).
    - cron: '30 11 * * 1-5'
  # Manual run from the Actions tab or `gh workflow run daily-ingest.yml -f days=365` (initial backfill).
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to load'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger ingestion
        env:
          # Repository settings: secret ADMIN_TOKEN (same value as on Render), variable FXPULSE_API_URL.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_URL: ${{ vars.FXPULSE_API_URL }}
          DAYS: ${{ inputs.days || '7' }}
        # -f makes curl fail on HTTP errors (401, 500, ...), so the job turns red.
        # --retry covers a waking free instance: timeouts, refused connections and 408/429/5xx. It doesn't
        # retry 401/403 (a wrong token won't fix itself). Worst case 5 x 120 s + 4 x 20 s < 15 min timeout.
        # Overlapping attempts are safe: ingestion skips stored dates and the unique key guards the rest.
        run: |
          [ -n "$API_URL" ] || { echo "Repository variable FXPULSE_API_URL is not set"; exit 1; }
          curl -fsS --retry 4 --retry-connrefused --retry-delay 20 --max-time 120 \
            -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
            "$API_URL/api/admin/ingest?days=$DAYS"
