services:
  db:
    image: postgres:16
    container_name: fxpulse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fxpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fxpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fxpulse}
    ports:
      - "${DB_PORT:-25432}:5432"   # host 25432 avoids clashing with locally installed PostgreSQL (5432/5433)
    volumes:
      - fxpulse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fxpulse-db-data:
